name: Japan Economy Monitor

on:
  workflow_dispatch:
  schedule:
    - cron: "0 22 * * *"

jobs:
  monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run CPI
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python estat.py

      - name: Run GDP
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python gdp.py

      - name: Run unemployment
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python unemployment.py

      - name: Run real wage
        run: python real_wage.py

      - name: Run consumption
        env:
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: python consumption.py

      - name: Run risk calculation
        run: python risk.py